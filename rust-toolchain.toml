[toolchain]
# Pin the compiler version while resolving the installed host triple, matching
# the member pins. A Windows executable cannot run on macOS or Linux. Compiler
# identity checks remain owned by scripts/atlas-toolchain-preflight.py; cross
# compilation selects a target with Cargo's --target rather than changing the
# compiler host. See docs/adr/0069-portable-host-toolchain.md.
channel = "1.97.0"
components = ["rustfmt", "clippy"]
