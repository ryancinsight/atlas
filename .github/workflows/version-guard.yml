# Atlas version-guard integration gate (versioning "pin discipline" +
# engineering_gates workflow hygiene).
#
# Runs `scripts/atlas-version-guard-sweep.py` at the stack root: the toolchain
# preflight (one compiler identity across pinned members) followed by the
# `version-guard coherence` scan over every checked-in Cargo manifest under
# registered Atlas members. The scan is offline, read-only, and deterministic;
# it fails when a first-party requirement does not accept the current package
# version.
#
# Per-member diff scanning (`version-guard scan`) belongs in each member repo's
# own CI and is not part of this gate.

name: version-guard

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'repos/**/Cargo.toml'
      - 'repos/**/Cargo.lock'
      - 'repos/**/rust-toolchain.toml'
      - 'scripts/atlas-toolchain-preflight.py'
      - 'scripts/atlas-provider-integration-audit.py'
      - 'scripts/atlas-version-guard-sweep.py'
      - 'scripts/tests/test_atlas_provider_integration_audit.py'
      - 'scripts/tests/test_atlas_version_guard_sweep.py'
      - 'tools/_template/**'
      - 'tools/version-guard/**'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'repos/**/Cargo.toml'
      - 'repos/**/Cargo.lock'
      - 'repos/**/rust-toolchain.toml'
      - 'scripts/atlas-toolchain-preflight.py'
      - 'scripts/atlas-provider-integration-audit.py'
      - 'scripts/atlas-version-guard-sweep.py'
      - 'scripts/tests/test_atlas_provider_integration_audit.py'
      - 'scripts/tests/test_atlas_version_guard_sweep.py'
      - 'tools/_template/**'
      - 'tools/version-guard/**'

concurrency:
  # Pull requests share one group per ref and cancel superseded runs. Default-
  # branch runs get one group per commit: GitHub always supersedes a *pending*
  # run in a shared group whatever `cancel-in-progress` says, so under runner
  # starvation every push cancelled the previous merge's verification.
  group: version-guard-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sweep:
    name: Toolchain preflight + coherence scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The coherence scan measures registered Atlas members. Some members
          # contain private fixture gitlinks without nested .gitmodules
          # metadata; recursive checkout would fail before the scan can run.
          # Direct members are sufficient for this job.
          submodules: false
          lfs: false

      - name: Initialize direct Atlas members
        shell: bash
        run: git -c protocol.version=2 submodule update --init --force --depth=1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0

      - name: Run version-guard sweep
        run: python3 scripts/atlas-version-guard-sweep.py
