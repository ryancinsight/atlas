name: Publish crate to crates.io

# Atlas owns the crate release pipeline once for the whole stack (ADR 0035).
# Package repositories call this workflow instead of copying it: before this
# workflow existed, seven packages carried the same 142-line file and differed
# only in the toolchain pin and whether they needed Atlas path dependencies.
#
# Authentication uses OIDC trusted publishing. crates.io trusts the calling
# repository's workflow identity and mints a short-lived token for one
# publish. Each crate registers its publisher once under crates.io -> crate
# Settings -> Trusted Publishing; an unregistered crate fails closed at the
# authentication step.
#
# The reusable workflow inherits the caller's event context, so a release-tag
# publish and a workflow_dispatch dry run both resolve here.
#
# Version-change publishing (ADR 0068): when the caller forwards a push to its
# default branch or a schedule, the plan job selects every publishable package
# whose manifest version is absent from the crates.io index, and the
# publish-pending job publishes that set in one `cargo publish` (Cargo orders
# the packages by dependency and waits for each to reach the index), then tags
# a release per package. A package the index has never seen is skipped with a
# notice: crates.io accepts only an API token for a first publish. A pending
# set whose dependency from another repository is not yet on the index waits
# with a warning; the next push or schedule retries it.

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Exact Rust toolchain used to package and publish
        required: true
        type: string
      tag-prefix:
        description: Release-tag prefix preceding <package>-v<version>
        required: false
        default: "crate-"
        type: string
      atlas-ref:
        description: >-
          Exact Atlas commit owning the provider gitlink graph. Set only for
          packages whose manifests carry Atlas path dependencies; leave empty to
          skip provider materialization.
        required: false
        default: ""
        type: string
      manifest:
        description: Manifest scanned for path dependencies when atlas-ref is set
        required: false
        default: Cargo.toml
        type: string
      dispatch-package:
        description: Workspace package validated without publishing on workflow_dispatch
        required: false
        default: ""
        type: string
      dispatch-version:
        description: Exact Cargo version validated on workflow_dispatch
        required: false
        default: ""
        type: string
      semver-toolchain:
        description: Toolchain for the version-change SemVer gate; empty uses rust-toolchain
        required: false
        default: ""
        type: string
permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    name: Plan version-change publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Atlas path dependencies
        if: inputs.atlas-ref != ''
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: ${{ inputs.manifest }}
          destination: ..
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Select packages whose manifest version is not on crates.io
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          # The sparse index serves one file per crate, one JSON line per
          # published version; a 404 means the name has never been published.
          index_path() {
            local n="${1,,}"
            case "${#n}" in
              1) echo "1/$n" ;;
              2) echo "2/$n" ;;
              3) echo "3/${n:0:1}/$n" ;;
              *) echo "${n:0:2}/${n:2:2}/$n" ;;
            esac
          }

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          # Assigned before the loop: a failure inside a process substitution
          # escapes set -e and would read as an empty candidate set.
          candidates="$(jq -r '.packages[] | select(.publish == null or (.publish | index("crates-io") != null)) | [.name, .version] | @tsv' <<<"$metadata")"
          pending=()
          while IFS=$'\t' read -r name version; do
            [[ -n "$name" ]] || continue
            status="$(curl -sS -o index.json -w '%{http_code}' "https://index.crates.io/$(index_path "$name")")"
            case "$status" in
              404)
                echo "::notice::$name has never been published; its first publish needs an API token before trusted publishing applies"
                ;;
              200)
                if ! jq -e --arg v "$version" 'select(.vers == $v)' index.json >/dev/null; then
                  pending+=("$name")
                fi
                ;;
              *)
                echo "crates.io index returned HTTP $status for $name" >&2
                exit 1
                ;;
            esac
          done <<<"$candidates"
          rm -f index.json

          if [[ "${#pending[@]}" -eq 0 ]]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Packaging resolves every dependency against the registry. A
          # dependency owned by another repository whose new version has not
          # published yet is a wait, not a defect: its own pipeline publishes
          # it, and the next push or schedule here retries the set.
          args=()
          for name in "${pending[@]}"; do args+=(--package "$name"); done
          if ! cargo package --locked --no-verify "${args[@]}" 2>package.log; then
            cat package.log >&2
            if grep -q 'failed to select a version for the requirement' package.log; then
              echo "::warning::pending packages (${pending[*]}) wait on a dependency version not yet on crates.io"
              echo "count=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          packages="$(IFS=,; echo "${pending[*]}")"
          echo "::notice::publishing $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "count=${#pending[@]}" >> "$GITHUB_OUTPUT"

  semver:
    needs: plan
    if: needs.plan.outputs.count != '0'
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@e9c6c0a8aae631adc9504d9d77a1c76d4e0c73a3
    permissions:
      contents: read
    with:
      release-gate: true
      package: ${{ needs.plan.outputs.packages }}
      rust-toolchain: ${{ inputs.semver-toolchain || inputs.rust-toolchain }}

  publish-pending:
    needs: [plan, semver]
    if: needs.plan.outputs.count != '0'
    name: Publish pending versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: crates-publish-pending-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: crates-io
    permissions:
      contents: write # release tags for the published versions
      id-token: write # OIDC trusted publishing; no stored registry token
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Atlas path dependencies
        if: inputs.atlas-ref != ''
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: ${{ inputs.manifest }}
          destination: ..
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Request a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the pending packages in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          set -euo pipefail
          args=()
          IFS=, read -ra names <<<"$PACKAGES"
          for name in "${names[@]}"; do args+=(--package "$name"); done
          cargo publish --locked "${args[@]}"

      # Runs after a partial publish failure too: a version that reached the
      # index is current to the next plan, so it is tagged now or never.
      - name: Tag a release for each published version
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          IFS=, read -ra names <<<"$PACKAGES"
          for name in "${names[@]}"; do
            version="$(jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version' <<<"$metadata")"
            n="${name,,}"
            case "${#n}" in
              1) path="1/$n" ;; 2) path="2/$n" ;; 3) path="3/${n:0:1}/$n" ;; *) path="${n:0:2}/${n:2:2}/$n" ;;
            esac
            if ! curl -fsS "https://index.crates.io/$path" | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              continue
            fi
            tag="${TAG_PREFIX}${name}-v${version}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              continue
            fi
            # A release created with GITHUB_TOKEN starts no workflow run, so
            # the release-event publish path does not fire a second time.
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$name $version" --latest=false \
              --notes "$name $version, published to crates.io from $GITHUB_SHA by trusted publishing."
          done

  validate:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: Validate crate package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Check out exact Atlas path dependencies
        if: inputs.atlas-ref != ''
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: ${{ inputs.manifest }}
          destination: ..
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Resolve and validate release identity
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.dispatch-package }}
          INPUT_VERSION: ${{ inputs.dispatch-version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            pattern="^${TAG_PREFIX}(.+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$"
            if [[ "$RELEASE_TAG" =~ $pattern ]]; then
              package="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[2]}"
            else
              echo "release tag must be ${TAG_PREFIX}<package>-v<version>" >&2
              exit 1
            fi
          else
            package="$INPUT_PACKAGE"
            version="$INPUT_VERSION"
            if [[ -z "$package" || -z "$version" ]]; then
              echo "dispatch-package and dispatch-version are required outside a release event" >&2
              exit 1
            fi
          fi

          if [[ ! "$package" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "invalid Cargo package name: $package" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          matches="$(jq --arg package "$package" '[.packages[] | select(.name == $package)] | length' <<<"$metadata")"
          if [[ "$matches" != "1" ]]; then
            echo "expected exactly one workspace package named $package; found $matches" >&2
            exit 1
          fi

          manifest_version="$(jq -r --arg package "$package" '.packages[] | select(.name == $package) | .version' <<<"$metadata")"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "release version $version does not match Cargo version $manifest_version" >&2
            exit 1
          fi

          publishable="$(jq -r --arg package "$package" '.packages[] | select(.name == $package) | (.publish == null or (.publish | index("crates-io") != null))' <<<"$metadata")"
          if [[ "$publishable" != "true" ]]; then
            echo "Cargo metadata marks $package as publish = false" >&2
            exit 1
          fi

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package and verify without publishing
        shell: bash
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
        run: cargo publish --locked --package "$RELEASE_PACKAGE" --dry-run

  publish:
    if: github.event_name == 'release'
    needs: validate
    name: Publish crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.validate.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Check out exact Atlas path dependencies
        if: inputs.atlas-ref != ''
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: ${{ inputs.manifest }}
          destination: ..
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Request a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the validated package
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_PACKAGE: ${{ needs.validate.outputs.package }}
        run: cargo publish --locked --package "$RELEASE_PACKAGE"
