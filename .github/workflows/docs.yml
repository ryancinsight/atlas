# Atlas Docs Invariant Gate (§7 #4 of docs/mdbook/detector-parity.md)
#
# Runs the portable detector plus an mdbook v0.5.4 build across all provider
# books (every `repos/*/docs/book` directory — 24 books as of 2026-08-11;
# ATLAS-BOOK-LINK-CI-001 extended the gate from the original five physics
# books to the whole stack).  See docs/mdbook/detector-parity.md §6 for the wiring
# rationale and §7 #5 for the strict-mode flip (drop `--advisory` from the
# detector step).

name: docs-invariant

on:
  pull_request:
    paths:
      - 'repos/**/docs/book/**'
      - 'scripts/check_mdbook_links.py'
      - '.github/workflows/docs.yml'
      - '.githooks/pre-commit'
      - 'scripts/tests/fixtures/smoke_test_filters/**'
      - 'docs/mdbook/detector-parity-kwavers.md'
  push:
    branches: [main]
    paths:
      - 'repos/**/docs/book/**'
      - 'scripts/check_mdbook_links.py'
      - '.github/workflows/docs.yml'
      - '.githooks/pre-commit'
      - 'scripts/tests/fixtures/smoke_test_filters/**'
      - 'docs/mdbook/detector-parity-kwavers.md'

# NOTE (reviewer follow-up, ATLAS-BOOK-LINK-CI-001): `repos/**/docs/book/**`
# intentionally covers non-`.md` assets too (images, embedded files), so an
# mdBook build or `{{#include}}` breakage from an asset change re-triggers the
# gate.  Provider-side book edits committed INSIDE a submodule surface to root
# CI as a `repos/<name>` gitlink change, which no `paths:` pattern matches;
# the gate is therefore enforced at the root-commit boundary (the documented
# Atlas delivery model — provider work is merged in the provider, then the
# gitlink is advanced from Atlas).

# Cancel in-flight runs of the same branch + workflow when a new commit lands.
concurrency:
  group: docs-invariant-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.97.0
  MDBOOK_LINKCHECK2_VERSION: 0.12.2

jobs:
  docs-link-check:
    name: Dead-link + mdbook build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Rust for mdBook linkcheck2
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install mdBook linkcheck2 backend
        run: cargo install mdbook-linkcheck2 --version "${MDBOOK_LINKCHECK2_VERSION}" --locked

      - name: Install mdbook v0.5.4 (binary release)
        run: |
          mkdir -p /tmp/mdbook-install
          curl -sSL --fail \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/tmp/mdbook-install
          sudo install -m 0755 /tmp/mdbook-install/mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: Detector (STRICT mode — §7 #5 flipped) — all provider books
        run: |
          python3 scripts/check_mdbook_links.py repos/*/docs/book \
            | tee detector.log
        # VARIANT 2 applied (post-§7-#5, see §7 #5 of the parity report):
        # `--advisory` removed; the detector's exit-1 on FILE_MISSING > 0
        # IS the strict gate — this step is exit-code-based.  A future
        # detector return-code refactor must not weaken it.  Every
        # `repos/*/docs/book` must reach `FILE_MISSING : 0` for CI to pass;
        # the glob means newly added provider books are gated automatically.

      - name: mdbook build — all provider books
        shell: bash
        run: |
          set -euo pipefail
          for book in repos/*/docs/book; do
            echo "== Building $book =="
            if ! output=$(mdbook build "$book" 2>&1); then
              echo "$output" | tail -20
              echo "::error::mdbook build FAILED for $book"
              exit 1
            fi
          done

      - name: Upload detector log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detector-log
          path: detector.log
          if-no-files-found: ignore

  # Consolidated regression guard for both inline-link false-positive
  # filters in scripts/check_mdbook_links.py:
  #   - SINGLE_CHAR_HREF_RE  (FDTD recurrence: p[n+1](x))
  #     see docs/mdbook/detector-parity-kwavers.md §3.2 Issue B
  #   - LATEX_HREF_RE        (LaTeX-cmd math: [F(m)](\\mathbf{r}_s, t))
  #     see docs/mdbook/detector-parity-kwavers.md §3 Issue A
  # Catches future detector refactors that re-enable either class.
  # Runs the portable detector over the consolidated fixture at
  # `scripts/tests/fixtures/smoke_test_filters/` (which exercises both
  # filters in one book walk) and fails CI if FILE_MISSING > 0.
  docs-link-smoke-test-filters:
    name: Detector filter regression (single-char + LaTeX)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: "Detector — consolidated filter smoke-test fixture (both filters ON, must report FILE_MISSING : 0)"
        run: |
          output=$(python3 scripts/check_mdbook_links.py scripts/tests/fixtures/smoke_test_filters 2>&1)
          echo "$output" | tee smoke-test-filters.log
          if ! echo "$output" | grep -qE '^  FILE_MISSING  : 0$'; then
            echo "::error::Detector filter regression -- FILE_MISSING > 0 on the consolidated smoke-test fixture. One of SINGLE_CHAR_HREF_RE / LATEX_HREF_RE (or a future filter) has regressed. Investigate \`extract_links()\` in scripts/check_mdbook_links.py before merging this change. Do NOT silence the regression with an allow-list entry; the filters are supposed to drop these patterns detector-wide."
            exit 1
          fi
        # Expected: `FILE_MISSING : 0` and exit 0.  The `::error::`
        # annotation surfaces a clear root-cause hint in PR comments when
        # a filter regresses.  An explicit grep (rather than relying on
        # exit code alone) ensures the message attributes the failure to
        # the smoke-test job even if the detector's exit-code logic
        # changes in the future.  The detector walks the whole fixture
        # in one run -- both chapters (single_char_filter.md +
        # latex_filter.md) are validated together; failure attribution
        # between the two filters is via the `file_missing` per-link
        # rows in the detector stdout if the gate ever trips.

      - name: Upload smoke-test-filters log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-test-filters-log
          path: smoke-test-filters.log
          if-no-files-found: ignore
