# Workflow lint (shared): a member's own `.github/workflows/*.yml` must be
# valid GitHub Actions, not merely valid YAML.
#
# Why this exists (ATLAS-WORKFLOW-LINT-2026-09-02): an invalid workflow file
# does not fail a check — GitHub rejects the file, schedules a run with **no
# jobs** named after the file path, and registers nothing on the pull request.
# The gate the file defines silently does not run, and the PR reads green. That
# has now landed three times on this stack: `msrv.yml` on eunomia and melinoe,
# and an `env`-context reference in a job `name` on harmonia. Every instance is
# statically detectable, so the check belongs in the gate rather than in a
# reviewer's memory.
#
# `actionlint` also carries shellcheck over `run:` blocks and pyflakes over
# `python` steps, and validates the expression contexts — which is exactly the
# class above.
#
# Callers:
#   workflow-lint:
#     uses: ryancinsight/atlas/.github/workflows/workflow-lint.yml@<sha>
#     permissions:
#       contents: read

name: Workflow lint (shared guard)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflows are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The self-reference resolves to this called workflow's repository and
      # exact revision, including when a member repository invokes it.
      - name: Run the native workflow analyzers
        uses: $/.github/actions/workflow-lint
        with:
          candidate: ${{ github.sha }}
