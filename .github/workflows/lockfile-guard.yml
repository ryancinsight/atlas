name: Lockfile integrity (shared guard)

# Atlas owns the lockfile-overlay guard once for the whole stack (backlog
# ATLAS-OVERLAY-LOCK-GUARD). Members that carry first-party `source =
# "git+..."` entries call this workflow instead of copying the job: before it
# existed, a seven-branch kwavers series went out with every git source
# stripped from Cargo.lock (the development overlay's `[patch]` redirects
# resolve first-party deps to local paths, and cargo records no source),
# failing all 24 CI jobs on each branch while the guard sat in the repo wired
# into one benchmark workflow and nowhere else.
#
# The caller must carry `scripts/lockfile.py` (the same tool the committed
# pre-push hook runs) and a Cargo.lock with at least one first-party git
# source. The check needs no toolchain, cache or build and is bounded at five
# minutes, so it fails in seconds rather than after a full matrix.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Cargo.lock resolves under --locked
        run: python3 scripts/lockfile.py --check
