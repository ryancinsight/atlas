name: Build Python release distributions

on:
  workflow_call:
    inputs:
      distribution:
        description: PyPI distribution name from release metadata
        required: true
        type: string
      import-name:
        description: Python module imported by the wheel smoke test
        required: true
        type: string
      manifest-path:
        description: Python crate manifest relative to the caller repository
        required: true
        type: string
      atlas-ref:
        description: Exact Atlas commit that owns the provider gitlink graph
        required: true
        type: string
      tag-prefix:
        description: Prefix removed from the GitHub Release tag to obtain the wheel version
        required: false
        default: "v"
        type: string
      abi3:
        description: >-
          Build one stable-ABI wheel per system rather than one per system per
          interpreter. The systems are glibc and musl Linux on x86_64 and
          aarch64, Windows x86_64, and macOS universal2.
        required: false
        default: false
        type: boolean
      abi3-python:
        description: Oldest Python interpreter used to build an abi3 wheel
        required: false
        default: "3.9"
        type: string
      python-versions:
        description: JSON array of CPython versions for non-abi3 wheels
        required: false
        default: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]'
        type: string
      python-test-path:
        description: >-
          Optional provider-owned pytest path run after wheel installation.
          The path is relative to the checked-out caller at source/ and must
          contain bounded value-semantic binding tests.
        required: false
        default: ""
        type: string
      pytest-version:
        description: Exact pytest version used by the optional binding gate
        required: false
        default: "8.4.2"
        type: string

permissions:
  contents: read

jobs:
  build-abi3:
    if: inputs.abi3
    name: ${{ matrix.target }} / ${{ matrix.manylinux }} / abi3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One row per system we publish for. `linux` marks the rows maturin
      # builds inside a manylinux/musllinux container, where the interpreter is
      # named `pythonX.Y` rather than the runner's `python`; matching on the
      # runner label instead would silently pick the wrong interpreter the
      # moment a second Linux row exists. `smoke` selects how the built wheel is
      # imported: a musllinux wheel will not install on a glibc runner, so it is
      # exercised in an Alpine container instead of being left untested.
      #
      # aarch64 rows run on native ARM runners rather than under emulation, so
      # the wheel is imported and its tests run on the architecture it targets.
      # macOS is universal2 and so covers both of its architectures in one file.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
            linux: true
            smoke: native
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
            linux: true
            smoke: native
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            linux: true
            smoke: alpine
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            linux: true
            smoke: alpine
          - os: windows-latest
            target: x86_64
            manylinux: "off"
            linux: false
            smoke: native
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: "off"
            linux: false
            smoke: native

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout exact Atlas provider graph
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: source/Cargo.toml
          destination: .
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Set up Python ${{ inputs.abi3-python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.abi3-python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path source/${{ inputs.manifest-path }}
            --out dist
            -i ${{ matrix.linux && format('python{0}', inputs.abi3-python) || 'python' }}

      - name: Install and import wheel
        if: matrix.smoke == 'native'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy
          python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
          python -c "import importlib; importlib.import_module('${{ inputs.import-name }}')"

      - name: Run provider binding behavior tests
        if: matrix.smoke == 'native' && inputs.python-test-path != ''
        shell: bash
        env:
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          PYTHON_TEST_PATH: source/${{ inputs.python-test-path }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==${PYTEST_VERSION}"
          python -m pytest --import-mode=importlib --disable-warnings --maxfail=1 "${PYTHON_TEST_PATH}"

      # A musllinux wheel carries a platform tag no glibc runner will install,
      # so the checks above would skip it and the wheel would ship unexercised.
      # The Alpine image is musl, matches the runner's architecture, and runs
      # the same install, import and test sequence. numpy publishes
      # musllinux_1_2 wheels for both x86_64 and aarch64, so nothing here has to
      # compile from source.
      - name: Install, import and test wheel on musl
        if: matrix.smoke == 'alpine'
        shell: bash
        env:
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          IMPORT_NAME: ${{ inputs.import-name }}
          TEST_PATH: ${{ inputs.python-test-path }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e IMPORT_NAME -e PYTEST_VERSION -e TEST_PATH \
            "python:${{ inputs.abi3-python }}-alpine" sh -euc '
              python -m pip install --disable-pip-version-check numpy
              python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
              python -c "import importlib; importlib.import_module(\"$IMPORT_NAME\")"
              if [ -n "$TEST_PATH" ]; then
                python -m pip install --disable-pip-version-check "pytest==$PYTEST_VERSION"
                python -m pytest --import-mode=importlib --disable-warnings --maxfail=1 "source/$TEST_PATH"
              fi
            '

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.manylinux }}-abi3
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-cpython:
    if: ${{ !inputs.abi3 }}
    name: ${{ matrix.target }} / ${{ matrix.manylinux }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The same six systems as the abi3 path, crossed with each interpreter.
      # Kept as an explicit include rather than an `os` list so the two paths
      # publish for the same set: a platform added to one and not the other is
      # a gap nobody notices until someone on it cannot install.
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
            linux: true
            smoke: native
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
            linux: true
            smoke: native
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            linux: true
            smoke: alpine
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            linux: true
            smoke: alpine
          - os: windows-latest
            target: x86_64
            manylinux: "off"
            linux: false
            smoke: native
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: "off"
            linux: false
            smoke: native

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout exact Atlas provider graph
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: source/Cargo.toml
          destination: .
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path source/${{ inputs.manifest-path }}
            --out dist
            -i ${{ matrix.linux && format('python{0}', matrix.python-version) || 'python' }}

      - name: Install and import wheel
        if: matrix.smoke == 'native'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy
          python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
          python -c "import importlib; importlib.import_module('${{ inputs.import-name }}')"

      - name: Run provider binding behavior tests
        if: matrix.smoke == 'native' && inputs.python-test-path != ''
        shell: bash
        env:
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          PYTHON_TEST_PATH: source/${{ inputs.python-test-path }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest==${PYTEST_VERSION}"
          python -m pytest --import-mode=importlib --disable-warnings --maxfail=1 "${PYTHON_TEST_PATH}"

      # As in the abi3 job: a musllinux wheel will not install on a glibc
      # runner, so without this the steps above would fail the job outright
      # rather than skip. The image tracks the interpreter this row builds for.
      - name: Install, import and test wheel on musl
        if: matrix.smoke == 'alpine'
        shell: bash
        env:
          PYTEST_VERSION: ${{ inputs.pytest-version }}
          IMPORT_NAME: ${{ inputs.import-name }}
          TEST_PATH: ${{ inputs.python-test-path }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e IMPORT_NAME -e PYTEST_VERSION -e TEST_PATH \
            "python:${{ matrix.python-version }}-alpine" sh -euc '
              python -m pip install --disable-pip-version-check numpy
              python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
              python -c "import importlib; importlib.import_module(\"$IMPORT_NAME\")"
              if [ -n "$TEST_PATH" ]; then
                python -m pip install --disable-pip-version-check "pytest==$PYTEST_VERSION"
                python -m pytest --import-mode=importlib --disable-warnings --maxfail=1 "source/$TEST_PATH"
              fi
            '

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.manylinux }}-cp${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  release-assets:
    if: ${{ always() && !failure() && !cancelled() }}
    name: Validate and attach release distributions
    needs: [build-abi3, build-cpython]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Checkout exact Atlas provider graph
        uses: ryancinsight/atlas/.github/actions/checkout-path-dependencies@cd6a78e8c9a9816b0fa5ff22ad9166edbb713894
        with:
          manifest: source/Cargo.toml
          destination: .
          atlas_ref: ${{ inputs.atlas-ref }}

      - name: Set up Python for source distribution
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "maturin==1.14.1"
          maturin sdist \
            --manifest-path "source/${{ inputs.manifest-path }}" \
            --out dist

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Validate release identity and wheel set
        shell: bash
        env:
          ABI3: ${{ inputs.abi3 }}
          DISTRIBUTION: ${{ inputs.distribution }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "$TAG_PREFIX"* ]]; then
            echo "release tag $RELEASE_TAG does not start with $TAG_PREFIX" >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#"$TAG_PREFIX"}"
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print | sort)

          # Assert which systems are present, not just how many wheels arrived.
          # A count alone cannot tell a missing platform from a duplicated one,
          # and the failure that matters is a system quietly dropping out of the
          # matrix -- which nobody notices until someone on it cannot install.
          # Each pattern is matched against the platform tag maturin writes.
          platforms=(
            manylinux_2_17_x86_64
            manylinux_2_17_aarch64
            musllinux_1_2_x86_64
            musllinux_1_2_aarch64
            win_amd64
            universal2
          )
          built=$(IFS=' '; echo "${wheels[*]}")
          missing=()
          for platform in "${platforms[@]}"; do
            case "$built" in
              *"$platform"*) ;;
              *) missing+=("$platform") ;;
            esac
          done
          if (( ${#missing[@]} > 0 )); then
            echo "no wheel was built for: ${missing[*]}" >&2
            echo "built: $built" >&2
            exit 1
          fi

          # One wheel per system for abi3; one per system per interpreter
          # otherwise. This catches a duplicate or a stray that the presence
          # check above would let through.
          if [[ "$ABI3" == "true" ]]; then
            expected=${#platforms[@]}
          else
            expected=$(( ${#platforms[@]} * $(jq 'length' <<<"$PYTHON_VERSIONS") ))
          fi
          if (( ${#wheels[@]} != expected )); then
            echo "expected $expected wheels, found ${#wheels[@]}" >&2
            echo "built: $built" >&2
            exit 1
          fi
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print | sort)
          if (( ${#sdists[@]} != 1 )); then
            echo "expected one source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi

          normalized_distribution=$(tr '[:upper:]' '[:lower:]' <<<"$DISTRIBUTION" | sed -E 's/[-_.]+/-/g' | tr -d '\r\n')
          for wheel in "${wheels[@]}"; do
            metadata=$(unzip -p "$wheel" '*/METADATA')
            wheel_name=$(sed -n 's/^Name: //p' <<<"$metadata" | head -n 1 | tr -d '\r')
            wheel_version=$(sed -n 's/^Version: //p' <<<"$metadata" | head -n 1 | tr -d '\r')
            normalized_wheel_name=$(tr '[:upper:]' '[:lower:]' <<<"$wheel_name" | sed -E 's/[-_.]+/-/g' | tr -d '\r\n')
            if [[ "$normalized_wheel_name" != "$normalized_distribution" ]]; then
              echo "$wheel: distribution $wheel_name does not match $DISTRIBUTION" >&2
              exit 1
            fi
            if [[ "$wheel_version" != "$release_version" ]]; then
              echo "$wheel: version $wheel_version does not match tag $RELEASE_TAG" >&2
              exit 1
            fi
          done
          sdist_metadata=$(tar -xOf "${sdists[0]}" '*/PKG-INFO')
          sdist_name=$(sed -n 's/^Name: //p' <<<"$sdist_metadata" | head -n 1 | tr -d '\r')
          sdist_version=$(sed -n 's/^Version: //p' <<<"$sdist_metadata" | head -n 1 | tr -d '\r')
          normalized_sdist_name=$(tr '[:upper:]' '[:lower:]' <<<"$sdist_name" | sed -E 's/[-_.]+/-/g' | tr -d '\r\n')
          if [[ "$normalized_sdist_name" != "$normalized_distribution" ]]; then
            echo "${sdists[0]}: distribution $sdist_name does not match $DISTRIBUTION" >&2
            exit 1
          fi
          if [[ "$sdist_version" != "$release_version" ]]; then
            echo "${sdists[0]}: version $sdist_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "${wheels[@]}" "${sdists[@]}" > dist/SHA256SUMS

      - name: Upload consolidated release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*

      - name: Attach wheels to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
