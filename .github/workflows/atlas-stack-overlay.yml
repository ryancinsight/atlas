# Uncommitted Atlas audit-sweep Step 2 overlay: tighten workflow
# permissions to least-privilege so the scanned class drops.
permissions:
  contents: read

# Atlas stack overlay coherence gate (architecture_scoping "pin discipline" + ATLAS-OVERLAY-001)
#
# Runs `python scripts/atlas-stack-overlay.py check`, which inspects every
# first-party Cargo.lock against the current local provider heads and exits
# nonzero when (a) a first-party requirement cannot be satisfied by the local
# tree (version lag -- the failure that motivated `87ab265`), or (b) a lock
# has drifted behind its provider's origin/main.
#
# Pin discipline (architecture_scoping): version metadata is sweep-triggering
# state -- any commit changing `version =` or first-party version requirements
# across an allowlisted member's manifest/lock fires this gate regardless of
# the commit message. Version movement backward fails the gate without an
# explicit declared release/bump intent footer; see ATLAS-VERSION-GUARD-001
# for the per-member guard.
#
# The script writes a generated-do-not-edit overlay block into the stack-root
# `.cargo/config.toml` from `cargo metadata` closure; this gate verifies the
# generated overlay would still satisfy every consumer lock against the local
# tree.
#
# Members are checked out at their default-branch heads (`--remote`), not at
# the recorded gitlinks: the gate measures coherence at the current provider
# heads the overlay is generated against. Gitlink-based (recursive) checkout
# failed CI whenever a recorded gitlink went stale (e.g. horae `572c0919`
# "not our ref", the ATLAS-GITLINK-DRIFT-056 class); a stale gitlink must not
# silence this gate.

name: atlas-stack-overlay

on:
  pull_request:
    paths:
      - 'repos/**'
      - '.cargo/config.toml'
      - 'scripts/atlas-stack-overlay.py'
      - 'repos/**/Cargo.toml'
      - 'repos/**/Cargo.lock'
      - 'repos/**/pyproject.toml'
      - '.github/workflows/atlas-stack-overlay.yml'
  push:
    branches: [main]
    paths:
      - 'repos/**'
      - '.cargo/config.toml'
      - 'scripts/atlas-stack-overlay.py'
      - 'repos/**/Cargo.toml'
      - 'repos/**/Cargo.lock'
      - 'repos/**/pyproject.toml'
      - '.github/workflows/atlas-stack-overlay.yml'

# Cancel in-flight runs of the same branch + workflow when a new commit lands.
concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: atlas-stack-overlay-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overlay-check:
    name: Stack overlay coherence (requirements satisfiable + locks match)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The gate measures member manifests/locks against current provider
          # heads, and recursive checkout fails whenever a recorded gitlink
          # goes stale (a recorded condition, ATLAS-GITLINK-DRIFT-056). Direct
          # members at their default heads are exactly what `check` scans.
          submodules: false
          lfs: false

      - name: Initialize direct Atlas members at default heads
        shell: bash
        run: git -c protocol.version=2 submodule update --init --force --depth=1 --remote

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Overlay check (must exit 0)
        run: |
          set +e
          output=$(python3 scripts/atlas-stack-overlay.py check 2>&1)
          status=$?
          set -e
          echo "$output" | tee overlay-check.log
          if [ "$status" -ne 0 ] || ! echo "$output" | grep -qE '^stack aligned:'; then
            echo "::error::Atlas stack overlay drift detected. The first-party Cargo.locks across the allowlisted members no longer resolve against the current local provider heads. Run \`python scripts/atlas-stack-overlay.py check\` locally for per-crate detail; satisfy the lag either by advancing consumer requirements to the provider's published version, or by advancing the provider workspace version forward. Do NOT silence this gate -- it is the structural guard against the ATLAS-VERSION-GUARD-001 motivating incident (\`87ab265\` on hermes: a sed dep-conversion silently reverted the workspace release 0.5.0 -> 0.4.1 and internal requirements to 0.4.0; origin lied about versions for ~10 hours; coeus stacked 18 commits on the undeliverable base)."
            exit 1
          fi
        # Explicit `grep '^stack aligned:'` rather than relying on exit code
        # alone -- ensures the failure message attributes the gate to the
        # overlay-check job if the script's exit-code logic changes in the
        # future. The script's contract is "exit nonzero on lag, print
        # `stack aligned:` on success"; the grep pins both.

      - name: Upload overlay-check log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overlay-check-log
          path: overlay-check.log
          if-no-files-found: ignore
