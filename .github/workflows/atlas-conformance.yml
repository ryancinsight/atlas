# Atlas conformance ratchet gate (engineering_gates "lint floor" + ATLAS-HYGIENE-BASELINE-001)
#
# Runs `python scripts/atlas-conformance.py check`: re-scans every registered
# member for the measured debt classes and fails when any per-repo count rises
# above the committed baseline (scripts/conformance-baseline.json). The
# baseline only decreases — a tightening is recorded by regenerating the
# baseline in the same change; an increase is new debt and blocks the merge.
#
# Triggers follow gitlink advances: a member submodule bump appears as a
# `repos/<name>` path, so every integration sweep re-measures the stack.

name: atlas-conformance

on:
  pull_request:
    paths:
      - 'repos/**'
      - 'docs/adr/**'
      - 'scripts/**'
      - '.github/workflows/atlas-conformance.yml'
      - 'backlog.md'
      - 'checklist.md'
      - 'gap_audit.md'
  push:
    branches: [main]
    paths:
      - 'repos/**'
      - 'docs/adr/**'
      - 'scripts/**'
      - '.github/workflows/atlas-conformance.yml'
      - 'backlog.md'
      - 'checklist.md'
      - 'gap_audit.md'

concurrency:
  # Pull requests share one group per ref and cancel superseded runs. Default-
  # branch runs get one group per commit: GitHub always supersedes a *pending*
  # run in a shared group whatever `cancel-in-progress` says, so under runner
  # starvation every push cancelled the previous merge's verification.
  group: atlas-conformance-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance-check:
    name: Debt-class ratchet (counts non-increasing vs committed baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The conformance scan measures registered Atlas members. Some
          # members contain private fixture gitlinks without nested
          # .gitmodules metadata; recursive checkout would fail before the
          # scan can run. Direct members are sufficient for this job.
          submodules: false
          lfs: false

      - name: Initialize direct Atlas members
        shell: bash
        run: git -c protocol.version=2 submodule update --init --force --depth=1

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install script requirements
        # Before the ratchet, not only before pytest: the conformance scanner's
        # malformed-workflow class needs PyYAML and degrades to zero without it.
        run: python3 -m pip install --quiet -r scripts/requirements-test.txt

      - name: Conformance check (ratchet must hold)
        shell: bash
        run: |
          set +e
          python3 scripts/atlas-conformance.py check > "$RUNNER_TEMP/conformance-check.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/conformance-check.log"
          exit "$status"
        # `shell: bash` is load-bearing. GitHub's default `run` shell is
        # `bash -e {0}` WITHOUT pipefail, so the previous
        # `python3 … | tee conformance-check.log` reported tee's exit code and
        # this gate could not fail at all — the ratchet was decorative for as
        # long as that pipeline stood. Redirect-then-cat keeps the log artefact
        # without putting the script's status behind a pipe.
        #
        # The script exits 1 on any RATCHET VIOLATION line; tightenings print
        # as baseline-update candidates and pass. Fix new debt at the source —
        # never by editing the baseline upward (that edit is the gamed ratchet
        # the gate exists to catch in review).

      - name: Book gate audit (committed provider revisions)
        shell: bash
        run: python3 scripts/atlas-book-gate-audit.py --check

      - name: Book gate audit regression tests
        shell: bash
        # The whole suite under its own runner (pytest.ini, requirements-test.txt);
        # the previous single-file unittest call gated 1 of 35 files. No pipe on
        # the pytest line: the step's verdict is pytest's exit code, unmasked.
        # Reports even when the ratchet step above fails: the test suite and the
        # debt ratchet are independent verdicts, and a fleet debt regression must
        # not hide whether the scripts still pass their tests.
        if: always()
        run: |
          python3 -m pytest scripts/tests -q -p no:cacheprovider

      - name: Committed Cargo.lock form (standalone, not overlay-stripped)
        shell: bash
        run: |
          set +e
          python3 scripts/atlas-lock-form.py check > "$RUNNER_TEMP/lock-form.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/lock-form.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::A committed Cargo.lock is in the stack-overlay stripped \
          form and cannot resolve on a clean checkout (ADR-0044). Repair with \
          'python scripts/atlas-lock-form.py regenerate <member>' — never by \
          rebuilding under the overlay, which reproduces the defect."
          fi
          exit "$status"
        # Redirect-then-cat, not a pipe: GitHub's default shell has no
        # pipefail, so `python3 … | tee` would report tee's status and the
        # gate could never fail. Same trap the conformance step above documents.

      - name: ADR index freshness + governance anomalies
        shell: bash
        run: |
          set +e
          output=$(python3 scripts/adr-index.py check 2>&1)
          status=$?
          set -e
          echo "$output" | tee adr-index-check.log
          # `check` exits nonzero only for a missing or stale index; duplicate
          # numbers and non-canonical statuses are reported on stdout at exit
          # 0. Gate on both, so the governance anomalies the board burns down
          # cannot silently reaccumulate.
          if [ "$status" -ne 0 ] || [ -n "$output" ]; then
            echo "::error::ADR governance drift. Reproduce locally with \
          'python scripts/adr-index.py check'; regenerate indexes with \
          'python scripts/adr-index.py generate'. Canonical statuses are \
          Proposed, Accepted, Rejected; ADR numbers are unique per repository."
            exit 1
          fi

      - name: Registry metadata (crates.io rejects these at upload)
        shell: bash
        run: |
          # crates.io enforces the keyword cap and the category taxonomy at
          # upload — after the version number is spent, so a rejection is not
          # retryable under that version. This check existed but was never
          # wired, and on the day it was it found kwavers declaring six
          # keywords and a category slug (`medical`) that does not exist.
          #
          # `shell: bash` is load-bearing: the default shell has no pipefail,
          # so piping to tee would report tee's exit code and the gate could
          # not fail.
          set +e
          python3 scripts/atlas-registry-metadata.py > registry-metadata-check.log 2>&1
          status=$?
          set -e
          cat registry-metadata-check.log
          exit "$status"

      - name: Upload registry metadata log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-metadata-check-log
          path: registry-metadata-check.log
          if-no-files-found: ignore

      - name: Upload ADR index log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adr-index-check-log
          path: adr-index-check.log
          if-no-files-found: ignore

      - name: Upload lock-form log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lock-form-check-log
          path: ${{ runner.temp }}/lock-form.log
          if-no-files-found: ignore

      - name: Upload conformance log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-check-log
          path: ${{ runner.temp }}/conformance-check.log
          if-no-files-found: ignore
