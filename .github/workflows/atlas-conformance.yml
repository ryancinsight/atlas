# Atlas conformance ratchet gate (engineering_gates "lint floor" + ATLAS-HYGIENE-BASELINE-001)
#
# Runs `python scripts/atlas-conformance.py check`: re-scans every registered
# member for the measured debt classes and fails when any per-repo count rises
# above the committed baseline (scripts/conformance-baseline.json). The
# baseline only decreases — a tightening is recorded by regenerating the
# baseline in the same change; an increase is new debt and blocks the merge.
#
# Triggers follow gitlink advances: a member submodule bump appears as a
# `repos/<name>` path, so every integration sweep re-measures the stack.

name: atlas-conformance

on:
  # No `paths` filter on pull requests, deliberately. Both jobs below are
  # required status checks named in the `main` ruleset, and a required check
  # that does not run never reports -- so a pull request touching only an
  # unlisted path (a `.gitignore` edit, say) is blocked forever rather than
  # merged unverified. That is the ruleset working as intended; the filter
  # was the defect. A filter belongs on a job that is *not* required, or on
  # the push trigger below, where nothing waits on the report.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'repos/**'
      - 'docs/adr/**'
      - 'scripts/**'
      # This workflow's `Workflows are valid` job lints every file under
      # `.github/workflows`, so a change to any of them is a change to what
      # it checks. Naming only some meant a shellcheck finding in another
      # (`semver-gate.yml`) could not be seen until something else landed.
      - '.github/workflows/**'
      - 'backlog.md'
      - 'checklist.md'
      - 'gap_audit.md'
  # For the `pin-drift` job only. Drift is a function of what the *members*
  # publish, so no atlas event can announce it: a member merging a pull request
  # makes atlas's pin stale without touching this repository at all. Time is
  # the only trigger that can catch that, which is why the 2026-09-21 sweep
  # found all of it at once. The jobs above opt out of this event, so a
  # scheduled run is one short network job, not a second copy of the ratchet.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  # Pull requests share one group per ref and cancel superseded runs. Default-
  # branch runs get one group per commit: GitHub always supersedes a *pending*
  # run in a shared group whatever `cancel-in-progress` says, so under runner
  # starvation every push cancelled the previous merge's verification.
  group: atlas-conformance-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # atlas authors the shared workflows the fleet calls, so its own files are
  # exactly the ones an invalid edit would break fleet-wide.
  workflow-lint:
    name: Workflows are valid
    # The schedule exists for `pin-drift`; this job keeps the triggers it had.
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/workflow-lint.yml
    permissions:
      contents: read

  conformance-check:
    name: Debt-class ratchet (counts non-increasing vs committed baseline)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The conformance scan measures registered Atlas members. Some
          # members contain private fixture gitlinks without nested
          # .gitmodules metadata; recursive checkout would fail before the
          # scan can run. Direct members are sufficient for this job.
          submodules: false
          lfs: false
          # The artifact-budget step ratchets against the PR base, so the
          # base ref must be reachable; blobless keeps the fetch small.
          fetch-depth: 0
          filter: blob:none

      - name: Initialize direct Atlas members
        shell: bash
        # The unresolved_references class resolves cited hashes against
        # member object stores, so each store needs full commit history --
        # a tip-only checkout would count every citation to an older commit
        # as fabricated. One blobless fetch per member gives exactly that
        # (commits and trees, no blob payloads): one negotiation instead of
        # a shallow fetch plus an unshallow, which doubled per-member time
        # and put the job past its own budget on the first attempt.
        run: |
          git config --global fetch.filter blob:none
          git -c protocol.version=2 submodule update --init --force

      - name: Fetch superproject refs for hash resolution
        shell: bash
        # actions/checkout leaves the superproject store without every
        # origin branch and tag, and the unresolved_references resolver
        # enumerates refs/remotes/origin/* and refs/tags/* (falling back to
        # refs/heads/*) before listing reachable commits. Without a full
        # ref fetch a cited hash that resolves in the development stack can
        # count as unresolved in CI and vice versa; the ratchet then tracks
        # checkout behavior instead of citation health.
        run: |
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install script requirements
        # Before the ratchet, not only before pytest: the conformance scanner's
        # malformed-workflow class needs PyYAML and degrades to zero without it.
        run: python3 -m pip install --quiet -r scripts/requirements-test.txt

      - name: Conformance check (ratchet must hold)
        shell: bash
        run: |
          set +e
          python3 scripts/atlas-conformance.py check > "$RUNNER_TEMP/conformance-check.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/conformance-check.log"
          exit "$status"
        # `shell: bash` is load-bearing. GitHub's default `run` shell is
        # `bash -e {0}` WITHOUT pipefail, so the previous
        # `python3 … | tee conformance-check.log` reported tee's exit code and
        # this gate could not fail at all — the ratchet was decorative for as
        # long as that pipeline stood. Redirect-then-cat keeps the log artefact
        # without putting the script's status behind a pipe.
        #
        # The script exits 1 on any RATCHET VIOLATION line; tightenings print
        # as baseline-update candidates and pass. Fix new debt at the source —
        # never by editing the baseline upward (that edit is the gamed ratchet
        # the gate exists to catch in review).

      - name: Artifact budgets (atlas boards and tracked images, ratchet-to-budget)
        shell: bash
        # Members run the same script through the shared artifact-budget.yml
        # workflow; this step gates atlas's own root boards. An over-budget
        # board may not grow against the base; an oversized image may not be
        # added or touched.
        run: |
          base=""
          if [ -n "${{ github.event.pull_request.base.sha || '' }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          args=()
          [ -n "$base" ] && args=(--base "$base")
          python3 scripts/atlas-artifact-budget.py check --root . "${args[@]}"

      - name: Book gate audit (committed provider revisions)
        shell: bash
        run: python3 scripts/atlas-book-gate-audit.py --check

      - name: Book gate audit regression tests
        shell: bash
        # The whole suite under its own runner (pytest.ini, requirements-test.txt);
        # the previous single-file unittest call gated 1 of 35 files. No pipe on
        # the pytest line: the step's verdict is pytest's exit code, unmasked.
        # Reports even when the ratchet step above fails: the test suite and the
        # debt ratchet are independent verdicts, and a fleet debt regression must
        # not hide whether the scripts still pass their tests.
        if: always()
        run: |
          python3 -m pytest scripts/tests -q -p no:cacheprovider

      - name: Committed Cargo.lock form (standalone, not overlay-stripped)
        shell: bash
        run: |
          set +e
          python3 scripts/atlas-lock-form.py check > "$RUNNER_TEMP/lock-form.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/lock-form.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::A committed Cargo.lock is in the stack-overlay stripped \
          form and cannot resolve on a clean checkout (ADR-0044). Repair with \
          'python scripts/atlas-lock-form.py regenerate <member>' — never by \
          rebuilding under the overlay, which reproduces the defect."
          fi
          exit "$status"
        # Redirect-then-cat, not a pipe: GitHub's default shell has no
        # pipefail, so `python3 … | tee` would report tee's status and the
        # gate could never fail. Same trap the conformance step above documents.

      - name: ADR index freshness + governance anomalies
        shell: bash
        run: |
          set +e
          output=$(python3 scripts/adr-index.py check 2>&1)
          status=$?
          set -e
          echo "$output" | tee adr-index-check.log
          # `check` exits nonzero only for a missing or stale index; duplicate
          # numbers and non-canonical statuses are reported on stdout at exit
          # 0. Gate on both, so the governance anomalies the board burns down
          # cannot silently reaccumulate.
          if [ "$status" -ne 0 ] || [ -n "$output" ]; then
            echo "::error::ADR governance drift. Reproduce locally with \
          'python scripts/adr-index.py check'; regenerate indexes with \
          'python scripts/adr-index.py generate'. Canonical statuses are \
          Proposed, Accepted, Rejected; ADR numbers are unique per repository."
            exit 1
          fi

      - name: Registry metadata (crates.io rejects these at upload)
        shell: bash
        run: |
          # crates.io enforces the keyword cap and the category taxonomy at
          # upload — after the version number is spent, so a rejection is not
          # retryable under that version. This check existed but was never
          # wired, and on the day it was it found kwavers declaring six
          # keywords and a category slug (`medical`) that does not exist.
          #
          # `shell: bash` is load-bearing: the default shell has no pipefail,
          # so piping to tee would report tee's exit code and the gate could
          # not fail.
          set +e
          python3 scripts/atlas-registry-metadata.py > registry-metadata-check.log 2>&1
          status=$?
          set -e
          cat registry-metadata-check.log
          exit "$status"

      - name: Upload registry metadata log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-metadata-check-log
          path: registry-metadata-check.log
          if-no-files-found: ignore

      - name: Upload ADR index log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adr-index-check-log
          path: adr-index-check.log
          if-no-files-found: ignore

      - name: Upload lock-form log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lock-form-check-log
          path: ${{ runner.temp }}/lock-form.log
          if-no-files-found: ignore

      - name: Upload conformance log artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-check-log
          path: ${{ runner.temp }}/conformance-check.log
          if-no-files-found: ignore

  pin-drift:
    name: Gitlink pins at their members' default branches
    runs-on: ubuntu-latest
    # Not in the pull-request round trip: the measurement below is gated to
    # gitlink changes, so on an ordinary pull request this job costs a checkout
    # and exits. The budget covers the scheduled run, which reads 28 remotes
    # and initialises 28 members.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Members are initialised below, and only when the scan applies.
          submodules: false
          lfs: false
          # The scope step diffs against the base, so it must be reachable.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether the pins changed
        id: scope
        shell: bash
        # One remote round trip per member is not a per-pull-request cost. It
        # is paid on the schedule, and on any change that moves a pin -- a
        # `repos/<name>` gitlink or `.gitmodules` itself. When the base cannot
        # be resolved the answer is to measure: an undetermined scope must fail
        # towards running the check, never towards skipping it.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled or manual run: measuring every member."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Base revision unavailable: measuring rather than assuming clean."
            exit 0
          fi
          # `grep -E ... > /dev/null`, never `grep -q`: under `pipefail`, `-q`
          # exits at the first match and the SIGPIPE it sends upstream becomes
          # the pipeline's status, so a *matching* diff can report 141 and skip
          # the scan -- a false pass on exactly the change this job exists for.
          if git diff --name-only "$base" HEAD | grep -E '^(\.gitmodules$|repos/)' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "A gitlink or .gitmodules changed: measuring."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No pin moved in this change: the scheduled run covers drift."
          fi

      - name: Initialize direct Atlas members
        if: steps.scope.outputs.run == 'true'
        shell: bash
        # Full commit history, unlike the ratchet job's `--depth=1`: counting
        # the distance from a pin to a tip needs both commits and the path
        # between them. Blobless keeps that cheap -- the guard reads history,
        # never file content.
        run: git -c protocol.version=2 submodule update --init --force --filter=blob:none

      - name: Setup Python 3.11
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Pins within one sweep of their members' defaults
        if: steps.scope.outputs.run == 'true'
        shell: bash
        # Redirect-then-cat, not a pipe: the default shell has no pipefail, so
        # piping to tee would report tee's status and this gate could not fail.
        # Same trap the conformance step above documents.
        run: |
          set +e
          python3 scripts/atlas-pin-drift.py > "$RUNNER_TEMP/pin-drift.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/pin-drift.log"
          if [ "$status" -eq 2 ]; then
            echo "::error::A member could not be measured, so no pin can be called \
          current. This is not a pass: re-run once the remotes are reachable."
          elif [ "$status" -ne 0 ]; then
            echo "::error::A recorded gitlink has drifted from its member's default \
          branch, or names a commit that branch does not carry. Advance the pin, or \
          record the hold with a reason and a re-open trigger in \
          scripts/pin-drift-waivers.json."
          fi
          exit "$status"

      - name: Upload pin-drift log artefact
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pin-drift-log
          path: ${{ runner.temp }}/pin-drift.log
          if-no-files-found: ignore
