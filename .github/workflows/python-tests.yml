name: Python script tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest-fast:
    name: Run pytest (fast)
    runs-on: ubuntu-latest
    # Checkout, member init, pip, a toolchain install, cargo-semver-checks, then the
    # non-slow suite at up to 8 workers. 10 min covers the installs and a few minutes
    # of suite; the suite is the only piece that grows with the repository, so the
    # bound moves with it.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Initialize direct Atlas members
        shell: bash
        # Git --jobs parallelizes cloning only. Materialize full-history,
        # blobless recorded pins in four disjoint worktrees concurrently.
        run: python3 scripts/atlas_ci_members.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Setup recorded fast-suite toolchains
        # Both pins resolve to the same 1.97.0 channel, so this is a single
        # `rustup toolchain install --profile minimal`: 3 min is the bound #708 set
        # for that install, the same action as in the slow job.
        timeout-minutes: 3
        shell: bash
        run: |
          # The fixtures select these versions themselves. Finish installation
          # before xdist workers can concurrently provision the same toolchain.
          python3 - <<'PY'
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          required = {}
          for manifest in ("rust-toolchain.toml", "tools/gitlink-coherence/rust-toolchain.toml"):
              pin = tomllib.loads(Path(manifest).read_text(encoding="utf-8"))["toolchain"]
              version = re.match(r"\d+\.\d+\.\d+", pin["channel"])
              channel = version.group(0) if version else pin["channel"]
              required.setdefault(channel, set()).update(pin.get("components", []))
          for channel, components in sorted(required.items()):
              command = ["rustup", "toolchain", "install", channel, "--profile", "minimal"]
              for component in sorted(components):
                  command.extend(("--component", component))
              subprocess.run(command, check=True)
          PY
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Run pytest (fast)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python - python -m pytest -v -p xdist.plugin -m "not slow" -n auto --maxprocesses=8 --max-worker-restart=0 --dist=worksteal <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import process_tree

          try:
              result = process_tree.run(
                  sys.argv[1:],
                  timeout=600,
                  output_mode=process_tree.OutputMode.INHERIT,
              )
          except process_tree.ProcessTreeTimeout as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(124) from error
          except process_tree.ProcessTreeCleanupError as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(1) from error
          raise SystemExit(result.returncode)
          PY

  pytest-slow:
    name: Run pytest (slow)
    runs-on: ubuntu-latest
    # The fast job's installs plus nextest, cargo-semver-checks, the pinned rustdoc
    # nightly, an mdbook cache restore with its cold `cargo install` fallback, then
    # the slow suite. 15 min covers those installs and the fixtures that build crates.
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Initialize direct Atlas members
        shell: bash
        # Preserve every recorded direct member without nested fixture clones.
        run: python3 scripts/atlas_ci_members.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Setup recorded consumer toolchain
        # One recorded channel from repos/aequitas with clippy and rustfmt: the same single
        # `rustup toolchain install --profile minimal` the fast job bounds at 3 (#708).
        timeout-minutes: 3
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("repos/aequitas/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          channel=$(printf '%s' "$channel" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain "$channel" wasm32-unknown-unknown

      - name: Install cargo-nextest
        # The build-identity tests run the hook's three steps, one of which is
        # `cargo nextest run`; same pin as the members' CI.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Install cargo-semver-checks for the locked SemVer comparison test
        # scripts/tests/test_atlas_semver_pr.py skips without both. One pinned tarball
        # through taiki-e/install-action: 3 min is that action's bound (#708), the
        # same pin the informational SemVer job installs.
        timeout-minutes: 3
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Install the pinned rustdoc nightly
        # One pinned nightly at the minimal profile: the same single `rustup toolchain
        # install` the two setup steps above bound at 3 (#708).
        timeout-minutes: 3
        run: rustup toolchain install nightly-2026-08-01 --profile minimal

      - name: Cache Cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mdbook-0.4.40
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      - name: Install mdbook
        run: |
          if ! command -v mdbook &> /dev/null; then
            cargo install mdbook --version 0.4.40 --locked
          fi

      - name: Run pytest (slow)
        run: |
          python - python -m pytest -v -m slow <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import process_tree

          try:
              result = process_tree.run(
                  sys.argv[1:],
                  timeout=600,
                  output_mode=process_tree.OutputMode.INHERIT,
              )
          except process_tree.ProcessTreeTimeout as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(124) from error
          except process_tree.ProcessTreeCleanupError as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(1) from error
          raise SystemExit(result.returncode)
          PY

  windows-lock-protocol:
    name: Native Windows lock protocol
    runs-on: windows-latest
    # A Windows runner, Git Bash selected by path, and two fixture invocations that
    # exercise the lock protocol with Python and Bash children. No toolchain, no
    # build; 5 min is the floor for two subprocess fixtures on Windows.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false

      - name: Setup native Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Select Git Bash for fixture subprocesses
        shell: pwsh
        run: |
          # Native CreateProcess may prefer the WSL launcher despite PATH.
          $bash = (Resolve-Path "$env:ProgramFiles/Git/bin/bash.exe" -ErrorAction Stop).Path
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw "Git Bash is missing" }
          "ATLAS_TEST_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:ProgramFiles/Git/usr/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ProgramFiles/Git/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Exercise native Python and Git Bash lock fixtures
        shell: bash
        run: |
          python -c 'import os, pathlib, subprocess; assert os.name == "nt"; bash = pathlib.Path(os.environ["ATLAS_TEST_BASH"]); assert bash.is_absolute() and bash.is_file(); assert "/git/" in bash.as_posix().lower(); subprocess.run([str(bash), "--version"], check=True)'
          status=0
          python -m unittest discover -s scripts/tests -p test_atlas_push_lock.py -v || status=1
          python -m unittest discover -s scripts/tests -p test_atlas_stale_reclaim.py -v || status=1
          exit "$status"
