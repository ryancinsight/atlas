name: Python script tests

on:
  pull_request:
    paths:
      - 'scripts/tests/**'
      - 'scripts/generate_book_figures/**'
      - 'scripts/requirements-test.txt'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/tests/**'
      - 'scripts/generate_book_figures/**'
      - 'scripts/requirements-test.txt'
      - '.github/workflows/python-tests.yml'

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-fast:
    name: Run pytest (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Run pytest (fast)
        run: |
          python -m pytest -v -m "not slow"

  pytest-slow:
    name: Run pytest (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mdbook-0.4.40
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      - name: Install mdbook
        run: |
          if ! command -v mdbook &> /dev/null; then
            cargo install mdbook --version 0.4.40 --locked
          fi

      - name: Run pytest (slow)
        run: |
          python -m pytest -v -m slow
