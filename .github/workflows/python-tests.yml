name: Python script tests

on:
  pull_request:
    paths:
      # The tools under test live in scripts/*.py; a fix there must re-run
      # the tests that cover it (09064d28 fixed a red test and produced no run).
      - 'scripts/*.py'
      - 'scripts/tests/**'
      - 'scripts/.benchmarks/**'
      - 'scripts/generate_book_figures/**'
      - 'scripts/requirements-test.txt'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      # The tools under test live in scripts/*.py; a fix there must re-run
      # the tests that cover it (09064d28 fixed a red test and produced no run).
      - 'scripts/*.py'
      - 'scripts/tests/**'
      - 'scripts/.benchmarks/**'
      - 'scripts/generate_book_figures/**'
      - 'scripts/requirements-test.txt'
      - '.github/workflows/python-tests.yml'

concurrency:
  # Pull requests share one group per ref and cancel superseded runs. Default-
  # branch runs get one group per commit: GitHub always supersedes a *pending*
  # run in a shared group whatever `cancel-in-progress` says, so under runner
  # starvation every push cancelled the previous merge's verification.
  group: python-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-fast:
    name: Run pytest (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Run pytest (fast)
        run: |
          python -m pytest -v -m "not slow"

  pytest-slow:
    name: Run pytest (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Cache Cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mdbook-0.4.40
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      - name: Install mdbook
        run: |
          if ! command -v mdbook &> /dev/null; then
            cargo install mdbook --version 0.4.40 --locked
          fi

      - name: Run pytest (slow)
        run: |
          python -m pytest -v -m slow
