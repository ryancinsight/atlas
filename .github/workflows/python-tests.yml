name: Python script tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # The tools under test live in scripts/*.py; a fix there must re-run
      # the tests that cover it (09064d28 fixed a red test and produced no run).
      - 'scripts/*.py'
      - 'scripts/tests/**'
      - 'scripts/.benchmarks/**'
      - 'scripts/generate_book_figures/**'
      - 'scripts/requirements-test.txt'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      # The tools under test live in scripts/*.py; a fix there must re-run
      # the tests that cover it (09064d28 fixed a red test and produced no run).
      - 'scripts/*.py'
      - 'scripts/tests/**'
      - 'scripts/.benchmarks/**'
      - 'scripts/generate_book_figures/**'
      - 'scripts/requirements-test.txt'
      - '.github/workflows/python-tests.yml'

concurrency:
  # Pull requests share one group per ref and cancel superseded runs. Default-
  # branch runs get one group per commit: GitHub always supersedes a *pending*
  # run in a shared group whatever `cancel-in-progress` says, so under runner
  # starvation every push cancelled the previous merge's verification.
  group: python-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-fast:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Run pytest (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Initialize direct Atlas members
        shell: bash
        # Git --jobs parallelizes cloning only. Materialize full-history,
        # blobless recorded pins in four disjoint worktrees concurrently.
        run: python3 scripts/atlas_ci_members.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Setup recorded fast-suite toolchains
        timeout-minutes: 3
        shell: bash
        run: |
          # The fixtures select these versions themselves. Finish installation
          # before xdist workers can concurrently provision the same toolchain.
          python3 - <<'PY'
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          required = {}
          for manifest in ("rust-toolchain.toml", "tools/gitlink-coherence/rust-toolchain.toml"):
              pin = tomllib.loads(Path(manifest).read_text(encoding="utf-8"))["toolchain"]
              version = re.match(r"\d+\.\d+\.\d+", pin["channel"])
              channel = version.group(0) if version else pin["channel"]
              required.setdefault(channel, set()).update(pin.get("components", []))
          for channel, components in sorted(required.items()):
              command = ["rustup", "toolchain", "install", channel, "--profile", "minimal"]
              for component in sorted(components):
                  command.extend(("--component", component))
              subprocess.run(command, check=True)
          PY

      - name: Run pytest (fast)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -v -p xdist.plugin -m "not slow" -n auto --maxprocesses=8 --max-worker-restart=0 --dist=worksteal

  pytest-slow:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Run pytest (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Initialize direct Atlas members
        shell: bash
        # Preserve every recorded direct member without nested fixture clones.
        run: python3 scripts/atlas_ci_members.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Setup recorded consumer toolchain
        timeout-minutes: 3
        shell: bash
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("repos/aequitas/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal

      - name: Install cargo-nextest
        # The build-identity tests run the hook's three steps, one of which is
        # `cargo nextest run`; same pin as the members' CI.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Cache Cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mdbook-0.4.40
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      - name: Install mdbook
        run: |
          if ! command -v mdbook &> /dev/null; then
            cargo install mdbook --version 0.4.40 --locked
          fi

      - name: Run pytest (slow)
        run: |
          python -m pytest -v -m slow
