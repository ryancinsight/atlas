name: Python script tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest-fast:
    name: Run pytest (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Initialize direct Atlas members
        shell: bash
        # Git --jobs parallelizes cloning only. Materialize full-history,
        # blobless recorded pins in four disjoint worktrees concurrently.
        run: python3 scripts/atlas_ci_members.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Setup recorded fast-suite toolchains
        timeout-minutes: 3
        shell: bash
        run: |
          # The fixtures select these versions themselves. Finish installation
          # before xdist workers can concurrently provision the same toolchain.
          python3 - <<'PY'
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          required = {}
          for manifest in (
              "rust-toolchain.toml",
              "tools/gitlink-coherence/rust-toolchain.toml",
              "tools/version-guard/rust-toolchain.toml",
          ):
              pin = tomllib.loads(Path(manifest).read_text(encoding="utf-8"))["toolchain"]
              version = re.match(r"\d+\.\d+\.\d+", pin["channel"])
              channel = version.group(0) if version else pin["channel"]
              required.setdefault(channel, set()).update(pin.get("components", []))
          for channel, components in sorted(required.items()):
              command = ["rustup", "toolchain", "install", channel, "--profile", "minimal"]
              for component in sorted(components):
                  command.extend(("--component", component))
              subprocess.run(command, check=True)
          PY

      - name: Restore version-guard build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        env:
          # The root pin names Windows; cache identity needs the portable host.
          RUSTUP_TOOLCHAIN: 1.97.0
        with:
          workspaces: tools/version-guard -> ../../target
          shared-key: python-fast-version-guard
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-on-failure: true

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Run pytest (fast)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python - python -m pytest -v -p xdist.plugin -m "not slow" -n auto --maxprocesses=8 --max-worker-restart=0 --dist=worksteal <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import process_tree

          try:
              result = process_tree.run(
                  sys.argv[1:],
                  timeout=600,
                  output_mode=process_tree.OutputMode.INHERIT,
              )
          except process_tree.ProcessTreeTimeout as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(124) from error
          except process_tree.ProcessTreeCleanupError as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(1) from error
          raise SystemExit(result.returncode)
          PY

  pytest-slow:
    name: Run pytest (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          lfs: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Initialize direct Atlas members
        shell: bash
        # Preserve every recorded direct member without nested fixture clones.
        run: python3 scripts/atlas_ci_members.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-test.txt

      - name: Setup recorded consumer toolchain
        timeout-minutes: 3
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("repos/aequitas/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          channel=$(printf '%s' "$channel" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt

      - name: Install cargo-nextest
        # The build-identity tests run the hook's three steps, one of which is
        # `cargo nextest run`; same pin as the members' CI.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Cache Cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mdbook-0.4.40
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      - name: Install mdbook
        run: |
          if ! command -v mdbook &> /dev/null; then
            cargo install mdbook --version 0.4.40 --locked
          fi

      - name: Run pytest (slow)
        run: |
          python - python -m pytest -v -m slow <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import process_tree

          try:
              result = process_tree.run(
                  sys.argv[1:],
                  timeout=600,
                  output_mode=process_tree.OutputMode.INHERIT,
              )
          except process_tree.ProcessTreeTimeout as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(124) from error
          except process_tree.ProcessTreeCleanupError as error:
              print(str(error), file=sys.stderr)
              raise SystemExit(1) from error
          raise SystemExit(result.returncode)
          PY
