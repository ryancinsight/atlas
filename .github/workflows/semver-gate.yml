# Atlas owns the semver gate once for the whole stack
# (backlog ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28). Members that publish
# crates call this workflow instead of hand-rolling a per-repo copy
# (divergent per-repo copies are the duplication defect ADR 0035 exists to
# prevent). Members adopt it by advancing one atlas-ref pin, exactly like
# the publish and lockfile-guard pipelines.
#
# Design constraint (why the naive job fails): members accumulate accepted
# breaking changes under CHANGELOG Unreleased, so a gate that diffs main
# against the published baseline is red from its first run and gets ignored
# within a day. This gate therefore:
#   - on PRs: runs INFORMATIONALLY against the PR base so the detected
#     change-class is visible while the change is still in review. The
#     continue-on-error sits on the *step*, not the job: a job-level
#     continue-on-error still reports the job's conclusion as `failure`, so
#     `gh pr checks` and any bot reading the check list see red on every PR
#     carrying an accepted break. That is the same desensitisation this header
#     opens by rejecting, and it also pages PR-watching automation on a check
#     that cannot pass by design. The step absorbs the failure, the job
#     concludes green, and the verdict is written to the run summary where a
#     reviewer actually reads it (ATLAS-SEMVER-INFORMATIONAL-REPORTS-RED),
#   - on a release event — a published release, a tag push, or a caller
#     that sets `release-gate: true` (the member's release workflow, which
#     may run on `workflow_dispatch`) — runs BLOCKING against the previous
#     published version and fails when the manifest version does not cover
#     the detected class. Members whose CI workflow pushes only on branches
#     must call this gate from the workflow that runs the release
#     (ATLAS-SEMVER-GATE-RELEASE-JOB-UNREACHABLE): a job gated on tag pushes
#     inside a branch-only workflow never has an event.
#
# Why the release job is not simply "every non-pull_request event"
# (ATLAS-SEMVER-GATE-MAIN-PUSH-RED): a member's CI workflow runs on pushes
# to its default branch, so that condition ran the blocking comparison on
# every merge — red by construction against the published baseline, which
# is precisely the failure this header opens by rejecting. Release intent is
# caller knowledge, not event knowledge, so the caller declares it.
#
# Release baseline (why the registry, not the previous tag): a tag baseline
# is rebuilt from source, and its first-party git dependencies resolve
# against the branch head — once a dependency has bumped past the
# requirement the tag recorded, that resolution fails before any verdict
# (apollo-fft v0.26.0 requires hermes-simd ^0.6 while the git source now
# publishes 0.7: ATLAS-APOLLO-SEMVER-BASELINE-UNBUILDABLE). The published
# baseline resolves from the registry, where every dependency the release
# shipped against still exists, and it is the artifact the semver contract
# is about. `baseline-source: tag` keeps the tag baseline for crates that
# are not published.
#
# First publication: a crate that is not yet on crates.io has no registry
# baseline, and cannot break a public surface it has never published. The
# release gate asks crates.io directly and skips the check in that one case,
# recording a notice. It asks rather than inferring from the check's failure,
# because "not published" and "registry unreachable" produce the same failure
# and must not produce the same decision — treating an outage as a first
# publication would skip the gate on every release during one.
#
# No library target (why a surface-less set skips rather than fails):
# cargo-semver-checks renders a verdict from rustdoc-documented API
# surfaces, and a binary or proc-macro crate has none. A selection where
# every crate lacks a library target — apollo-fft-macros pending alone —
# makes the check error "no crates with library targets selected" and
# exit 101: that is a crash, not a verdict, and a release gate must not
# fail a release for a comparison it cannot render. The gate therefore
# selects the library-bearing names up front, by the same rule the check
# itself applies when it skips a crate in a mixed set (target kind lib,
# rlib, dylib, cdylib, or staticlib), and skips the comparison with a
# notice when none remain (ATLAS-SEMVER-NO-LIBRARY-TARGET). A mixed set
# keeps every library crate gated; only the surface-less names drop out.
#
# Rotted registry baseline (why an unbuildable baseline skips rather than
# fails): the registry baseline survives first-party version moves that
# break a tag baseline (ATLAS-APOLLO-SEMVER-BASELINE-UNBUILDABLE), but it
# can rot in place instead. leto 0.43.1 declares `aequitas ^0.2`; aequitas
# 0.2.1 moved its eunomia requirement 0.8 -> 0.9 in a PATCH, so a fresh
# resolution of the baseline admits both eunomia lines at once and the
# published crate no longer compiles (Quantity::in_unit bounds across two
# copies). The published artifact cannot be edited or republished, so no
# future run can render a verdict for it: failing the release on it blocks
# every later release of the member forever. When the comparison fails,
# the gate therefore probes whether each registry baseline still builds
# from a fresh resolution, re-runs the comparison over the crates whose
# baselines do build, and skips only the rotted names with a notice
# (ATLAS-SEMVER-BASELINE-ROT). A failure with every baseline buildable
# still blocks the release: that is a verdict, or a current tree that does
# not compile, and neither is this case.
#
# Inputs:
#   package         - crate name(s), comma-separated (required)
#   manifest-path   - path to Cargo.toml (default "Cargo.toml")
#   rust-toolchain  - toolchain for semver-checks (default "stable")
#   baseline-source - release baseline: "registry" (default; the latest
#                     published version) or "tag" (the previous release tag)

name: SemVer gate (shared)

on:
  workflow_call:
    inputs:
      package:
        description: Crate name(s) to check, comma-separated (the action's package input is a comma-separated list of package id specs)
        required: true
        type: string
      manifest-path:
        description: Path to the workspace Cargo.toml
        required: false
        type: string
        default: Cargo.toml
      rust-toolchain:
        description: Rust toolchain for cargo-semver-checks
        required: false
        type: string
        default: stable
      baseline-source:
        description: Release baseline — "registry" (latest published version) or "tag" (previous release tag)
        required: false
        type: string
        default: registry
      apt-packages:
        description: >-
          System packages the crates' build scripts need, space separated.
          cargo-semver-checks builds rustdoc for both revisions, so a crate
          whose build script links a system library (CFDrs reaches
          yeslogic-fontconfig-sys through its plotting stack) fails here
          exactly as `cargo doc` would, with the C library's name in the
          error rather than anything about semver.
        required: false
        type: string
        default: ""
      release-gate:
        description: Run the blocking release comparison — set by the caller's release workflow, whose event is not itself a tag push
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  semver-pr:
    name: SemVer (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # cargo-semver-checks builds rustdoc for both revisions, several minutes
      # per call. A pull request that changes no Rust source, manifest, lock,
      # or toolchain pin cannot change the public API, so the comparison has
      # nothing to find there. The release gate below always runs.
      - name: Detect a change that can move the public API
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Captured first: under pipefail, grep -q closing the pipe early
          # would fail a long diff and read as no match.
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          if grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain(\.toml)?$' <<<"$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select packages with a library target
        id: checkable
        env:
          PACKAGE: ${{ inputs.package }}
          MANIFEST: ${{ inputs.manifest-path }}
        run: |
          # The library-bearing subset of the selection, by the same rule
          # cargo-semver-checks applies when it skips a crate with no
          # library target. A surface-less crate has no rustdoc API to
          # compare, so gating it is not a verdict the gate can render.
          set -euo pipefail
          packages="$(python3 - <<'PY'
          import json, os, subprocess
          wanted = [n.strip() for n in os.environ["PACKAGE"].split(",") if n.strip()]
          metadata = subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1",
               "--manifest-path", os.environ["MANIFEST"]],
              capture_output=True, text=True, check=True).stdout
          lib_kinds = {"lib", "rlib", "dylib", "cdylib", "staticlib"}
          has_api = {p["name"] for p in json.loads(metadata)["packages"]
                     if any(lib_kinds & set(t["kind"]) for t in p["targets"])}
          print(",".join(n for n in wanted if n in has_api))
          PY
          )"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "::notice::none of ${PACKAGE} has a library target, so there is no public API surface for a semver verdict; the gate skips the comparison"
            {
              echo "### SemVer: not compared"
              echo ""
              echo "None of \`${PACKAGE}\` has a library target. A binary or proc-macro surface cannot be rustdoc-documented, so there is no semver contract to gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install system packages the build scripts need
        if: inputs.apt-packages != '' && steps.scope.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}
      - id: semver
        if: steps.scope.outputs.rust == 'true' && steps.checkable.outputs.packages != ''
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        with:
          package: ${{ steps.checkable.outputs.packages }}
          manifest-path: ${{ inputs.manifest-path }}
          rust-toolchain: ${{ inputs.rust-toolchain }}
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          verbose: true
      - name: Report the detected change class
        run: |
          if [ "${{ steps.checkable.outputs.packages }}" = "" ]; then
            : # The library-target selection already reported why nothing was compared.
          elif [ "${{ steps.scope.outputs.rust }}" != "true" ]; then
            {
              echo "### SemVer: not compared"
              echo ""
              echo "The pull request changes no Rust source, manifest, lock, or toolchain pin, so the public API cannot differ from the base."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.semver.outcome }}" = "success" ]; then
            {
              echo "### SemVer: no update required"
              echo ""
              echo "No breaking or additive change detected against the PR base."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### SemVer: a version bump is required"
              echo ""
              echo "\`cargo-semver-checks\` detected a change the current manifest version does not cover. Open the step log above for the failing checks."
              echo ""
              echo "This job stays green on purpose: on a pull request the gate is informational, and members accumulate accepted breaking changes under CHANGELOG \`[Unreleased]\`. Record the break there. The blocking comparison runs at release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  semver-release:
    name: SemVer (release gate)
    if: >-
      inputs.release-gate
      || github.event_name == 'release'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select packages with a library target
        id: checkable
        env:
          PACKAGE: ${{ inputs.package }}
          MANIFEST: ${{ inputs.manifest-path }}
        run: |
          # The library-bearing subset of the selection, by the same rule
          # cargo-semver-checks applies when it skips a crate with no
          # library target. A surface-less crate has no rustdoc API to
          # compare, so gating it is not a verdict the gate can render.
          set -euo pipefail
          packages="$(python3 - <<'PY'
          import json, os, subprocess
          wanted = [n.strip() for n in os.environ["PACKAGE"].split(",") if n.strip()]
          metadata = subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1",
               "--manifest-path", os.environ["MANIFEST"]],
              capture_output=True, text=True, check=True).stdout
          lib_kinds = {"lib", "rlib", "dylib", "cdylib", "staticlib"}
          has_api = {p["name"] for p in json.loads(metadata)["packages"]
                     if any(lib_kinds & set(t["kind"]) for t in p["targets"])}
          print(",".join(n for n in wanted if n in has_api))
          PY
          )"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "::notice::none of ${PACKAGE} has a library target, so there is no public API surface for a semver verdict; the gate skips the comparison"
            {
              echo "### SemVer: not compared"
              echo ""
              echo "None of \`${PACKAGE}\` has a library target. A binary or proc-macro surface cannot be rustdoc-documented, so there is no semver contract to gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install system packages the build scripts need
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}
      - name: Determine whether a registry baseline exists
        id: baseline-exists
        if: inputs.baseline-source == 'registry'
        env:
          PACKAGE: ${{ steps.checkable.outputs.packages }}
        run: |
          # A first publication has no published version to compare against,
          # and cannot break a public surface that has never been published.
          # Without this the release gate is unpassable for exactly one release
          # per crate — its first — and the only ways past it would be to
          # delete the gate or to publish around it, both of which cost the
          # gate on every release after.
          #
          # `package` is a comma-separated list, and crates.io answers one name
          # per request: asking for the joined list is a 404 that reads as a
          # first publication and skips the gate for every multi-crate caller.
          # Each name is asked separately and the published subset is gated.
          set -euo pipefail
          published=()
          IFS=, read -ra names <<<"$PACKAGE"
          for name in "${names[@]}"; do
            name="${name// /}"
            [[ -n "$name" ]] || continue
            # curl prints `000` for `%{http_code}` when no HTTP answer arrives and then
            # exits nonzero; the assignment's own status keeps that `000` and nothing else.
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: atlas-semver-gate (github.com/ryancinsight/atlas)' \
              "https://crates.io/api/v1/crates/${name}")" || status=000
            if [[ "$status" == "404" ]]; then
              echo "::notice::${name} is not on crates.io; this is its first publication, so there is no baseline to compare against."
            elif [[ "$status" == "200" ]]; then
              published+=("$name")
            else
              # Anything else is the registry being unreachable, not an answer.
              # Failing here is correct: silently treating an outage as "first
              # publication" would skip the gate on every release during one.
              echo "crates.io returned HTTP ${status} for ${name}; cannot establish a baseline" >&2
              exit 1
            fi
            sleep 1 # crates.io crawler policy: one API request per second
          done
          if [[ "${#published[@]}" -eq 0 ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "packages=$(IFS=,; echo "${published[*]}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve previous release tag as baseline
        id: baseline
        if: inputs.baseline-source == 'tag'
        run: |
          # On a tag push GITHUB_REF is the release tag; on any other event the
          # newest tag reachable from the checked-out revision is the baseline.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || true)"
          else
            prev="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          if [ -z "$prev" ]; then
            echo "No previous release tag found; falling back to the initial commit."
            prev="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "baseline=$prev" >> "$GITHUB_OUTPUT"
      - id: semver
        # The step's failure is not the job's conclusion: a rotted registry
        # baseline is indistinguishable from a verdict at this point, and the
        # probe below separates them. The verdict step fails the job for
        # everything the probe does not exonerate.
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        # Skipped for a first publication against the registry baseline,
        # which the step above established by asking crates.io rather than by
        # inferring it from a failure, and when no selected crate has a
        # library target whose surface could carry a verdict.
        if: >-
          steps.checkable.outputs.packages != ''
          && (inputs.baseline-source != 'registry'
          || steps.baseline-exists.outputs.published == 'true')
        with:
          package: ${{ inputs.baseline-source == 'registry' && steps.baseline-exists.outputs.packages || steps.checkable.outputs.packages }}
          manifest-path: ${{ inputs.manifest-path }}
          rust-toolchain: ${{ inputs.rust-toolchain }}
          # Empty for the registry baseline: cargo-semver-checks then compares
          # against the latest published version of each package.
          baseline-rev: ${{ inputs.baseline-source == 'tag' && steps.baseline.outputs.baseline || '' }}
          verbose: true
      - name: Probe whether each registry baseline can still build
        id: baseline-probe
        # Only a failed comparison needs the split: on success there is no
        # question to answer, and a tag baseline's rot is documented at
        # ATLAS-APOLLO-SEMVER-BASELINE-UNBUILDABLE instead.
        if: >-
          steps.semver.outcome == 'failure'
          && inputs.baseline-source == 'registry'
          && steps.baseline-exists.outputs.published == 'true'
        env:
          PACKAGE: ${{ steps.baseline-exists.outputs.packages }}
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          # One probe project per crate, depending on the published name at
          # its latest version: exactly the resolution the comparison's
          # baseline build performs. A crate whose baseline cannot compile
          # here cannot compile there either, and the drift that broke it is
          # outside this release's diff.
          set -euo pipefail
          rotted=()
          buildable=()
          IFS=, read -ra names <<<"$PACKAGE"
          for name in "${names[@]}"; do
            name="${name// /}"
            [[ -n "$name" ]] || continue
            probe="$RUNNER_TEMP/baseline-probe-$name"
            log="$RUNNER_TEMP/baseline-probe-$name.log"
            rm -rf "$probe"
            cargo "+$RUST_TOOLCHAIN" new --lib "$probe" >/dev/null 2>&1
            if ( cd "$probe" \
              && cargo add "$name" >/dev/null 2>&1 \
              && cargo doc -p "$name" --no-deps >"$log" 2>&1 ); then
              buildable+=("$name")
            else
              echo "::notice::the published baseline of ${name} does not compile from a fresh registry resolution; see the probe log below"
              cat "$log" 2>/dev/null || true
              rotted+=("$name")
            fi
          done
          {
            echo "rotted=$(IFS=,; echo "${rotted[*]}")"
            echo "others=$(IFS=,; echo "${buildable[*]}")"
          } >> "$GITHUB_OUTPUT"
      - id: semver-retry
        # The verdict of the comparison for the crates whose baselines still
        # build. A rotted sibling must not consume their verdict.
        continue-on-error: true
        if: >-
          steps.baseline-probe.outputs.rotted != ''
          && steps.baseline-probe.outputs.others != ''
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        with:
          package: ${{ steps.baseline-probe.outputs.others }}
          manifest-path: ${{ inputs.manifest-path }}
          rust-toolchain: ${{ inputs.rust-toolchain }}
          # The registry baseline, like the comparison above.
          baseline-rev: ''
          verbose: true
      - name: Render the release verdict
        id: verdict
        env:
          COMPARISON: ${{ steps.semver.outcome }}
          ROTTED: ${{ steps.baseline-probe.outputs.rotted }}
          OTHERS: ${{ steps.baseline-probe.outputs.others }}
          RETRY: ${{ steps.semver-retry.outcome }}
        run: |
          set -euo pipefail
          if [ "$COMPARISON" = "skipped" ]; then
            : # An earlier step reported why nothing was compared.
          elif [ "$COMPARISON" = "success" ]; then
            {
              echo "### SemVer: no update required"
              echo ""
              echo "Every selected crate's manifest version covers the changes against its published baseline."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$ROTTED" ]; then
            echo "cargo-semver-checks failed with every baseline buildable: a breaking change the manifest version does not cover, or a current tree that does not compile. The release is blocked." >&2
            exit 1
          elif [ -z "$OTHERS" ]; then
            echo "::notice::no semver verdict is possible: the published baseline of every selected crate is unbuildable (registry drift), so the release continues without one"
            {
              echo "### SemVer: not comparable"
              echo ""
              echo "The published baseline of \`${ROTTED}\` no longer compiles from a fresh registry resolution (dependency drift outside this release), so \`cargo-semver-checks\` can render no verdict. The release continues un-gated for these names."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RETRY" = "success" ]; then
            echo "::notice::the published baseline of ${ROTTED} is unbuildable (registry drift) and was not compared; every crate whose baseline still builds passed the comparison"
            {
              echo "### SemVer: partially comparable"
              echo ""
              echo "The published baseline of \`${ROTTED}\` no longer compiles from a fresh registry resolution (dependency drift outside this release), so those names are un-gated. \`${OTHERS}\` passed the comparison against their baselines."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "the re-run comparison over ${OTHERS} failed with every one of their baselines buildable: the release is blocked." >&2
            exit 1
          fi
