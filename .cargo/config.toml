# Shared build directory for the whole Atlas stack.
#
# Per the workspace build-budget policy, every repo routes its build through
# one CARGO_TARGET_DIR so shared dependency artifacts (themis, moirai,
# mnemosyne, half, …) are compiled once into a single cache instead of being
# duplicated into per-repo `target/` directories.
#
# This relative path only reaches the Atlas target directory for builds whose
# *workspace root* is this directory -- that is what cargo resolves
# `build.target-dir` against, not the parent of `.cargo`. Inside
# `repos/<member>` the workspace root is the member, and this same line would
# resolve to that member's own `target/`. `repos/.cargo/config.toml`, generated
# by `scripts/atlas-member-target-dir.py`, carries an absolute path to the
# primary checkout's cache. The generator resolves Git's common directory, so
# member builds from a linked Atlas worktree still use the primary cache.
#
# A root-level Cargo invocation inside an Atlas-meta worktree still resolves
# this relative path to that worktree's `target/`. Build Atlas-root Rust tools
# from the primary checkout until root-level worktree routing has a portable
# configuration; member builds use the generated absolute pin above.
#
# Tradeoff (intentional, see the build-budget rule): concurrent builds across
# repos serialize on the shared build lock — disk size outranks build
# parallelism. Reversible by deleting this file (builds revert to per-repo
# `target/`). Per-repo `.cargo/config.toml` settings (e.g. aliases) still merge
# and take precedence over this file.
[build]
target-dir = "target"

# Profile budget (build-size/memory policy). Config profiles override
# manifest profiles, so every hash-bearing key set here is one value for the
# whole stack, whatever a member manifest declares -- and that is the point:
# cargo keys every shared artifact on the resolved profile, so each member
# whose root profile differs (coeus and kwavers at dev opt-level 1, helios at
# 1 with dependencies at 3, moirai at test opt-level 1) compiled its own
# copy of every shared dependency into this cache. Measured 2026-09-22:
# ritk_filter's lib carried 19 fingerprint variants across 4 profile hashes
# within 14 hours, debug/deps held 10.3 GiB of rlibs beyond one copy per
# crate, and a seven-day age sweep reclaimed 13 MiB of a 119 GiB tree
# because every copy was live. A named-package raise in a member manifest
# (`[profile.dev.package.<crate>] opt-level = 3`) still applies -- it is
# more specific than the wildcard -- and is the only sanctioned form.
#
# Debuginfo: full DWARF/PDB is the dominant debug-artifact and link-memory
# cost for generic-heavy code. Development and test code keep line tables
# (file:line backtraces, no variable/type info); dependencies get no
# debuginfo at all -- step-debugging a dependency is the rare exception,
# re-enable per-package locally when needed. Full debuginfo belongs only in
# an explicit [profile.profiling] inside the workspace that needs it; release
# artifacts carry none and are stripped.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0
debug = false

# Build scripts and proc-macros are compile-time-only tools; their debuginfo is
# never stepped through in ordinary work and only inflates the shared cache.
[profile.dev.build-override]
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 0
debug = false

[profile.test.build-override]
debug = false

[profile.release]
debug = false
strip = "symbols"

# >>> atlas stack development overlay (generated) >>>
# Generated by scripts/atlas-stack-overlay.py -- do not hand-edit.
#
# Redirects every first-party git dependency to its local working tree, for all
# builds rooted anywhere beneath the Atlas root. Member manifests keep their
# `git + version` sources, so each repository still resolves standalone and in
# CI exactly as published.
#
# A `[patch]` section committed in a member manifest does NOT do this: Cargo
# honors manifest patches only in the root manifest of the build, so such a
# block is inert for every downstream consumer while making the member
# unconsumable as a clean git dependency.
#
# A local candidate is emitted for each source with a compatible consumer.
# Cargo keeps incompatible requirements on their original git version; one
# lagging consumer must not prevent current consumers from sharing local types.
# Providers whose own workspace edges lag remain quarantined on git. `check`
# reports all incompatible requirements so their consumers can advance them.
#
# Local builds rewrite member `Cargo.lock` files (the `source` line is dropped
# and `[[patch.unused]]` entries appear). That churn is a development artifact:
# never commit it. Release and CI resolution is verified with `--locked` from a
# clean checkout, where this overlay does not apply.
#
# Regenerate:  python scripts/atlas-stack-overlay.py generate
# Check lag:   python scripts/atlas-stack-overlay.py check

