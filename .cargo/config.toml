# Shared build directory for the whole Atlas stack.
#
# Per the workspace build-budget policy, every repo routes its build through
# one CARGO_TARGET_DIR so shared dependency artifacts (themis, moirai,
# mnemosyne, half, …) are compiled once into a single cache instead of being
# duplicated into per-repo `target/` directories.
#
# Cargo resolves a relative `build.target-dir` against the parent of the
# directory holding the file that declares it (verified on cargo 1.97.0), which
# for this file is the root of the checkout holding it. This line therefore
# names `<root>/target` for every build started below that root, including
# builds inside `repos/<member>`, and it is the shared cache only in the
# primary checkout. `repos/.cargo/config.toml`, generated by
# `scripts/atlas-member-target-dir.py`, carries an absolute path to the primary
# checkout's cache instead. The generator resolves Git's common directory, so a
# file generated in a linked Atlas worktree still names the primary cache.
#
# A root-level Cargo invocation inside an Atlas-meta worktree resolves this
# relative path to that worktree's `target/`. Build Atlas-root Rust tools
# from the primary checkout until root-level worktree routing has a portable
# configuration; member builds use the generated absolute pin above.
#
# Tradeoff (intentional, see the build-budget rule): concurrent builds across
# repos serialize on the shared build lock — disk size outranks build
# parallelism. Reversible by deleting this file (builds revert to per-repo
# `target/`). Per-repo `.cargo/config.toml` settings (e.g. aliases) still merge
# and take precedence over this file.
[build]
target-dir = "target"

# Profile budget (build-size/memory policy). Config profiles override
# manifest profiles, so every hash-bearing key set here is one value for the
# whole stack, whatever a member manifest declares -- and that is the point:
# cargo keys every shared artifact on the resolved profile, so each member
# whose root profile differs (coeus and kwavers at dev opt-level 1, helios at
# 1 with dependencies at 3, moirai at test opt-level 1) compiled its own
# copy of every shared dependency into this cache. Measured 2026-09-22:
# ritk_filter's lib carried 19 fingerprint variants across 4 profile hashes
# within 14 hours, debug/deps held 10.3 GiB of rlibs beyond one copy per
# crate, and a seven-day age sweep reclaimed 13 MiB of a 119 GiB tree
# because every copy was live.
#
# Named raises (docs/adr/0071-stack-build-profile-budget.md): a crate whose
# unoptimized code makes a member's push gate miss its deadline is raised by
# name in `[profile.dev.package]` below, never by a wildcard and never in a
# member manifest, so the raised crate still has one profile, and one copy,
# for the whole stack. `[profile.test]` inherits the named entries. A
# named-package raise in a member manifest still applies -- it is more
# specific than the wildcard -- and gives that member its own copy of the
# crate; it is not the sanctioned form.
#
# Debuginfo: full DWARF/PDB is the dominant debug-artifact and link-memory
# cost for generic-heavy code. Development and test code keep line tables
# (file:line backtraces, no variable/type info); dependencies get no
# debuginfo at all -- step-debugging a dependency is the rare exception,
# re-enable per-package locally when needed. Full debuginfo belongs only in
# an explicit [profile.profiling] inside the workspace that needs it; release
# artifacts carry none and are stripped.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0
debug = false

# Numeric kernels at opt-level 1 (measurements: ADR 0071).
[profile.dev.package]
apollo-dctdst-core.opt-level = 1
apollo-fft.opt-level = 1
apollo-leto-interop.opt-level = 1
eunomia.opt-level = 1
hermes-simd.opt-level = 1
hermes-simd-core.opt-level = 1
hermes-simd-intrinsics.opt-level = 1
hermes-simd-types.opt-level = 1
leto.opt-level = 1
leto-ops.opt-level = 1
kwavers.opt-level = 1
kwavers-analysis.opt-level = 1
kwavers-boundary.opt-level = 1
kwavers-core.opt-level = 1
kwavers-diagnostics.opt-level = 1
kwavers-driver.opt-level = 1
kwavers-field.opt-level = 1
kwavers-gpu.opt-level = 1
kwavers-grid.opt-level = 1
kwavers-imaging.opt-level = 1
kwavers-math.opt-level = 1
kwavers-medium.opt-level = 1
kwavers-mesh.opt-level = 1
kwavers-phantom.opt-level = 1
kwavers-physics.opt-level = 1
kwavers-python.opt-level = 1
kwavers-receiver.opt-level = 1
kwavers-signal.opt-level = 1
kwavers-simulation.opt-level = 1
kwavers-solver.opt-level = 1
kwavers-source.opt-level = 1
kwavers-therapy.opt-level = 1
kwavers-transducer.opt-level = 1

# Build scripts and proc-macros are compile-time-only tools; their debuginfo is
# never stepped through in ordinary work and only inflates the shared cache.
[profile.dev.build-override]
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 0
debug = false

[profile.test.build-override]
debug = false

[profile.release]
debug = false
strip = "symbols"

